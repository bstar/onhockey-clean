name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            arguments: --linux AppImage --x64
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            arguments: --linux AppImage --arm64
          - platform: mac
            arch: x64
            runner: macos-15-intel
            arguments: --mac dmg zip --x64
          - platform: mac
            arch: arm64
            runner: macos-15
            arguments: --mac dmg zip --arm64
          - platform: win
            arch: x64
            runner: windows-2022
            arguments: --win nsis zip --x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: bash
        run: |
          node -e 'const v=require("./package.json").version; if(process.env.GITHUB_REF_TYPE !== "tag" || process.env.GITHUB_REF_NAME !== `v${v}`) throw Error("Run this workflow on the matching version tag")'
      - run: npm test
      - name: Package application
        run: npm run release:build -- ${{ matrix.arguments }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test packaged Linux application
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run test:package
      - name: Smoke test packaged macOS or Windows application
        if: matrix.platform != 'linux'
        run: npm run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            dist/*.zip

  publish:
    name: Publish downloads
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Verify assets and create checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
          sha256sum -- * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "OnHockey Clean $GITHUB_REF_NAME" --notes-file .github/release-notes.md --latest
